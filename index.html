<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Phone Showroom</title>
  <meta name="description" content="Every phone I've owned, on a showroom table — pick one up, turn it around, open it up.">

  <!-- link previews: og:video plays inline in Discord/Telegram/Slack; X and LinkedIn use the image -->

  <meta property="og:site_name" content="rr2.dev">
  <meta property="og:title" content="My Phone Showroom">
  <meta property="og:description" content="Every phone I've owned, on a showroom table — pick one up, turn it around, open it up.">
  <meta property="og:url" content="https://phones.rr2.dev/">
  <meta property="og:image" content="https://phones.rr2.dev/og-image.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="A round marble showroom table with my phones on stands">
  <meta property="og:video" content="https://phones.rr2.dev/og-video.mp4">
  <meta property="og:video:secure_url" content="https://phones.rr2.dev/og-video.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1280">
  <meta property="og:video:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@rahul_r007">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <canvas id="scene" aria-label="A round showroom table with my phones on stands"></canvas>

  <div id="loading" role="status"><span>Setting up the showroom…</span></div>

  <header class="top">
    <h1 class="title">My Phone Showroom</h1>
    <button type="button" id="overhead-btn" class="title overhead" aria-pressed="false" title="View from above">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><ellipse cx="8" cy="8" rx="6.5" ry="4.2"/><circle cx="8" cy="8" r="1.3"/><circle cx="3.6" cy="6.6" r="0.9"/><circle cx="12.4" cy="6.6" r="0.9"/><circle cx="8" cy="3.9" r="0.9"/><circle cx="8" cy="12.1" r="0.9"/></svg><span>From above</span>
    </button>
  </header>

  <aside id="directory" class="panel" aria-label="Phones">
    <div class="eyebrow">My phones</div>
    <ol id="dir-personal" class="timeline"></ol>
    <div class="eyebrow sub">Work table</div>
    <ul id="dir-work" class="worklist"></ul>
  </aside>

  <section id="specs" class="panel" aria-live="polite"></section>

  <ol id="steps" class="steps" hidden>
    <li data-step="1">1 Cover off</li>
    <li data-step="2">2 Battery out</li>
  </ol>

  <nav id="controls" class="controls" aria-label="Controls"></nav>
  <p id="hint" class="hint" hidden></p>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="credits">
    <span id="credit-text"></span>
    <span class="built">Built by Rahul · <a href="https://rr2.dev" target="_blank" rel="noopener">rr2.dev</a></span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
